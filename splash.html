<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Salisbury RE Desk</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0f0f11; color: #f7f4ef; font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; border: 1px solid #2a2a30; box-sizing: border-box; border-radius: 12px; }
      .mark { width: 72px; height: 72px; border-radius: 18px; background: linear-gradient(135deg, #ce011f, #7a0012); display: grid; place-items: center; font-weight: 800; font-size: 30px; letter-spacing: -1px; box-shadow: 0 12px 40px rgba(206, 1, 31, .35); }
      h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .2px; }
      .sub { margin: 0; font-size: 13px; color: #9a9aa3; }
      .bar { width: 320px; height: 6px; background: #1f1f24; border-radius: 6px; overflow: hidden; }
      .bar > i { display: block; height: 100%; width: 4%; background: #ce011f; border-radius: 6px; transition: width .35s ease; }
      .step { font-size: 12px; color: #c9c9d1; min-height: 16px; }
      .foot { position: absolute; bottom: 14px; font-size: 11px; color: #6c6c75; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">CS</div>
      <h1>Salisbury RE Desk</h1>
      <p class="sub">Cory Salisbury, REALTOR&reg; &middot; Simple Choice Real Estate</p>
      <div class="bar"><i id="fill"></i></div>
      <div class="step" id="step">Starting&hellip;</div>
      <div class="foot">Local-first. Nothing leaves this computer.</div>
    </div>
    <script type="module">
      import { listen } from '@tauri-apps/api/event';
      const fill = document.getElementById('fill');
      const step = document.getElementById('step');
      listen('progress', (e) => {
        const { step: s, pct } = e.payload;
        step.textContent = s;
        fill.style.width = Math.max(4, Math.min(100, pct)) + '%';
      });
      // Safety valve: if the main window never reports, keep the bar alive so it never looks frozen.
      let t = 4;
      const idle = setInterval(() => { if (parseFloat(fill.style.width) < 30) { t += 1; fill.style.width = t + '%'; } }, 400);
      listen('progress', () => clearInterval(idle));
    </script>
  </body>
</html>
